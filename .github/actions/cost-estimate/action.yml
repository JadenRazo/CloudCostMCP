name: "CloudCost Terraform Cost Estimate"
description: "Analyze Terraform changes and post cost estimates as PR comments"

inputs:
  terraform_dir:
    description: "Directory containing Terraform files (auto-detected from changed .tf files when omitted)"
    required: false
  providers:
    description: "Comma-separated list of cloud providers to compare"
    required: false
    default: "aws,azure,gcp"
  format:
    description: "Output format for the cost report (markdown, json, csv, focus)"
    required: false
    default: "markdown"
  currency:
    description: "Currency for cost output (USD, EUR, GBP, JPY, CAD, AUD, INR, BRL)"
    required: false
    default: "USD"
  github_token:
    description: "GitHub token used to post the cost estimate as a PR comment"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "24.15.0"

    - name: Install cloudcost-mcp
      shell: bash
      # Pinned to an exact version so the action does not silently pick up a
      # new (potentially breaking or compromised) release on every run.
      run: npm install -g @jadenrazo/cloudcost-mcp@1.0.1

    # All ${{ inputs.* }} and other attacker-influenceable values are passed
    # to bash via env: vars and referenced as "$VAR" — never interpolated
    # directly into run: scripts, which would allow shell injection through
    # crafted input values or branch names.
    - name: Validate inputs
      shell: bash
      env:
        FORMAT: ${{ inputs.format }}
        CURRENCY: ${{ inputs.currency }}
        PROVIDERS: ${{ inputs.providers }}
      run: |
        # Whitelist: format
        case "$FORMAT" in
          markdown|json|csv|focus) ;;
          *) echo "Error: invalid format '$FORMAT'. Allowed: markdown, json, csv, focus" >&2; exit 1 ;;
        esac

        # Whitelist: currency
        case "$CURRENCY" in
          USD|EUR|GBP|JPY|CAD|AUD|INR|BRL) ;;
          *) echo "Error: invalid currency '$CURRENCY'. Allowed: USD, EUR, GBP, JPY, CAD, AUD, INR, BRL" >&2; exit 1 ;;
        esac

        # Whitelist: providers — each comma-separated token must be aws, azure, or gcp
        IFS=',' read -ra _PROVIDERS <<< "$PROVIDERS"
        for _P in "${_PROVIDERS[@]}"; do
          _P="${_P// /}"  # strip any accidental whitespace
          case "$_P" in
            aws|azure|gcp) ;;
            *) echo "Error: invalid provider '$_P'. Allowed: aws, azure, gcp" >&2; exit 1 ;;
          esac
        done

    - name: Detect Terraform directory
      id: detect-dir
      shell: bash
      env:
        TERRAFORM_DIR_INPUT: ${{ inputs.terraform_dir }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ -n "$TERRAFORM_DIR_INPUT" ]; then
          echo "terraform_dir=$TERRAFORM_DIR_INPUT" >> "$GITHUB_OUTPUT"
          echo "has_tf=true" >> "$GITHUB_OUTPUT"
        else
          # Find directories that contain changed .tf files in this PR
          CHANGED_TF=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- '*.tf' 2>/dev/null || true)
          if [ -z "$CHANGED_TF" ]; then
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
          else
            # Use the directory of the first changed .tf file
            FIRST_TF_FILE=$(echo "$CHANGED_TF" | head -n 1)
            DETECTED_DIR=$(dirname "$FIRST_TF_FILE")
            echo "terraform_dir=$DETECTED_DIR" >> "$GITHUB_OUTPUT"
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Skip — no Terraform changes detected
      if: steps.detect-dir.outputs.has_tf == 'false'
      shell: bash
      run: |
        echo "No .tf files changed in this pull request. Skipping cost estimate."

    - name: Run cost estimate
      id: cost-estimate
      if: steps.detect-dir.outputs.has_tf == 'true'
      shell: bash
      env:
        TF_DIR: ${{ steps.detect-dir.outputs.terraform_dir }}
        FORMAT: ${{ inputs.format }}
        PROVIDERS: ${{ inputs.providers }}
        CURRENCY: ${{ inputs.currency }}
      run: |
        # Unique per-run temp file under the runner's private temp dir —
        # avoids clobbering/symlink games on a fixed world-writable /tmp path.
        REPORT_FILE=$(mktemp "$RUNNER_TEMP/cloudcost-report-XXXXXX.txt")

        # A CLI failure must fail this step loudly instead of posting an
        # empty or error-laden report as if it were a real estimate.
        if ! cloudcost compare "$TF_DIR" \
          --format "$FORMAT" \
          --providers "$PROVIDERS" \
          --currency "$CURRENCY" > "$REPORT_FILE" 2>&1; then
          echo "Error: 'cloudcost compare' failed. Output:" >&2
          cat "$REPORT_FILE" >&2
          exit 1
        fi

        echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: steps.detect-dir.outputs.has_tf == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT_FILE: ${{ steps.cost-estimate.outputs.report_file }}
      run: |
        REPORT_CONTENT=$(cat "$REPORT_FILE")

        # Build the comment body; prefix with a heading then append the report
        COMMENT_BODY="## CloudCost Terraform Cost Estimate

        ${REPORT_CONTENT}"

        # Escape the body for JSON using Python (available on ubuntu-latest runners)
        ESCAPED=$(printf '%s' "$COMMENT_BODY" | python3 -c "
        import sys, json
        body = sys.stdin.read()
        print(json.dumps(body))
        ")

        curl -s -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
          -d "{\"body\": ${ESCAPED}}"
