name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # contents: write is required to upload the SBOM as a release asset.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - name: audit production dependencies (blocking)
        run: npm audit --audit-level=high --omit=dev

      - name: audit including devDependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # The package ships its pricing tables inside the tarball, so publishing
      # is the moment those numbers reach users. Nothing checked their age
      # before: v1.2.1 went out on 2026-08-07 carrying GCP data last updated on
      # 2026-04-15 — 114 days old at publish time — and every install since has
      # been costing GCP resources off it.
      #
      # Deliberately blocking. A release is exactly where a stale-data warning
      # is cheapest to act on and most expensive to ignore, and the remedy is to
      # refresh the data rather than to raise the threshold.
      - name: Refuse to publish stale pricing data
        run: npx tsx scripts/check-freshness.ts

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber
