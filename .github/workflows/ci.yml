name: CI

# Every job in this workflow is a pure function of the commit.
#
# That is the whole rule, and it is mechanically applicable: if a job can go red
# without anyone changing a line of code, it does not belong here. It belongs in
# health.yml.
#
# This file used to break that rule three ways - a weekly `schedule` trigger, a
# `pricing-freshness` job that reads the calendar, and an `integration-smoke` job
# that depends on third-party API uptime - and the cost was concrete. The most
# recent CI run on main was the scheduled one from 2026-08-10, and it failed. So
# the CI badge on the profile README read "build: failing" while every single
# push run was green. The badge was reporting the calendar and being read as a
# statement about the code.
#
# Once base-rate red exceeds "sometimes", a maintainer rationally stops treating
# red as information. Keeping this file deterministic is what makes it safe to
# require as a status check, and what makes the badge mean something again.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'npm'
      - run: npm ci
      # Annotation, not a gate. `npm audit` is not deterministic: the dependency
      # tree is pinned but the advisory database changes daily, so a blocking
      # audit here fails pull requests over CVEs published by strangers. That is
      # what kept this job red through June and July on ~10 transitive `hono`
      # advisories, none of which any commit in this repo introduced.
      #
      # The signal is not dropped, it is placed where it can act:
      #   ci.yml      annotation  - a PR that ADDS a vulnerable dep is still
      #                             visible at review time
      #   publish.yml blocking    - nothing vulnerable ever ships
      #   health.yml  blocking    - a new CVE still gets an owner and a deadline,
      #                             within a day
      #
      # Honest cost: a CVE disclosed between releases no longer blocks an
      # unrelated PR. That is the intended effect of splitting the signal.
      - name: audit dependencies (annotation only)
        run: |
          set +e
          out=$(npm audit --audit-level=high --omit=dev 2>&1); prod=$?
          all=$(npm audit --audit-level=high 2>&1); dev=$?
          set -e
          if [ "$prod" != "0" ]; then
            echo "::warning::npm audit reports high/critical advisories in PRODUCTION dependencies. This does not fail CI, but it blocks publish.yml and is checked daily by health.yml."
            echo "$out"
          elif [ "$dev" != "0" ]; then
            echo "::notice::npm audit reports high/critical advisories in devDependencies only."
            echo "$all"
          else
            echo "npm audit: no high or critical advisories."
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src test
      # test:coverage enforces the vitest.config.ts coverage thresholds, so
      # the gate actually fails CI when coverage regresses below the floor.
      - run: npm run test:coverage
      - run: npm run build

  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
