name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly smoke test against live provider pricing APIs (Mondays 12:00 UTC)
    - cron: '0 12 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'npm'
      - run: npm ci
      - name: audit production dependencies (blocking)
        run: npm audit --audit-level=high --omit=dev
      - name: audit including devDependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src test
      # test:coverage enforces the vitest.config.ts coverage thresholds, so
      # the gate actually fails CI when coverage regresses below the floor.
      - run: npm run test:coverage
      - run: npm run build

  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pricing-freshness:
    # Guards against the bundled pricing data silently drifting stale. Runs
    # only on the weekly schedule (and manual dispatch) so ordinary PRs and
    # pushes never fail from calendar drift alone.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fail when any data/*/metadata.json last_updated is older than 21 days
        run: |
          node - <<'SCRIPT'
          const { readFileSync } = require("node:fs");
          const MAX_AGE_DAYS = 21;
          const MS_PER_DAY = 86_400_000;
          let failed = false;
          for (const provider of ["aws", "azure", "gcp"]) {
            const path = `data/${provider}-pricing/metadata.json`;
            const meta = JSON.parse(readFileSync(path, "utf-8"));
            const asOf = new Date(meta.last_updated);
            if (Number.isNaN(asOf.getTime())) {
              console.error(`${path}: unparseable last_updated "${meta.last_updated}"`);
              failed = true;
              continue;
            }
            const ageDays = Math.floor((Date.now() - asOf.getTime()) / MS_PER_DAY);
            const status = ageDays > MAX_AGE_DAYS ? "STALE" : "ok";
            console.log(`${path}: last_updated=${meta.last_updated} age=${ageDays}d ${status}`);
            if (ageDays > MAX_AGE_DAYS) failed = true;
          }
          if (failed) {
            console.error(`Bundled pricing metadata exceeds ${MAX_AGE_DAYS} days — run 'npm run refresh-pricing' (see .github/workflows/refresh-pricing.yml).`);
            process.exit(1);
          }
          SCRIPT

  integration-smoke:
    # Exercises the live AWS/Azure/GCP pricing APIs. Only runs on manual
    # dispatch or the weekly schedule — skipped on regular PR/push traffic
    # to avoid coupling CI to third-party API availability.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run pricing smoke tests
        env:
          RUN_INTEGRATION: '1'
        run: npx vitest run test/integration/*.smoke.test.ts
