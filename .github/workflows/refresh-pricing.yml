name: Refresh Pricing

# Weekly refresh of bundled AWS/Azure/GCP fallback pricing tables.
# Opens a PR from bot/pricing-refresh (instead of committing straight to
# main) and files an issue when the refresh fails so failures are visible.

on:
  schedule:
    # Mondays 12:00 UTC — avoids weekend quiet hours and still hits before
    # the US business day so any follow-up investigation is same-day.
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-pricing
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    # Guard so forks don't try to open PRs/issues on schedule.
    if: github.repository_owner == 'JadenRazo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Mint a GitHub App installation token for the PR.
      #
      # Without this, create-pull-request falls back to GITHUB_TOKEN and pushes
      # as github-actions[bot]. This repo's Actions approval policy is
      # `first_time_contributors`, and that bot identity has no merged
      # contribution, so every push it makes parks the resulting CI and
      # Terraform Cost Estimate runs at `action_required` with zero jobs
      # allocated. PR #38 sat that way for six days. An App installation token
      # carries its own identity, so the events it raises schedule normally.
      #
      # If the client id is not configured the step is skipped and the workflow
      # falls back to GITHUB_TOKEN: the refresh still runs and still reports,
      # the PR just needs a manual "Approve and run" as it does today. So this
      # lands safely before the App exists.
      - name: Mint app token
        id: app-token
        if: vars.PRICING_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PRICING_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PRICING_BOT_PRIVATE_KEY }}
          # Least privilege: enough to push the branch and open the PR, nothing
          # else. The App is installed on this repository only.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run pricing refresh (write mode)
        id: refresh
        # A provider-level failure exits non-zero but still writes the providers
        # that succeeded, so the job has to keep going for those changes to reach
        # a PR.
        #
        # This used to be `continue-on-error: true`, which does keep the job
        # going — but it also rewrites the step's conclusion to `success`. The
        # run page then showed a green tick against a step whose upstream had
        # been returning 404 for four months, and the real verdict survived only
        # in `steps.refresh.outcome`, which the step meant to act on it read
        # incorrectly. Capturing the code explicitly keeps the exit status as
        # data and puts an annotation on the run.
        run: |
          set +e
          npx tsx scripts/refresh-pricing.ts --write
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            echo "::warning::pricing refresh exited $code — at least one provider did not refresh"
          fi
          exit 0

      - name: Build and test against refreshed data
        run: npm run build && npm test

      - name: Summarize changes
        id: diff
        run: |
          if git diff --quiet -- src/pricing data/aws-pricing data/azure-pricing data/gcp-pricing; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pricing changes detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Pricing refresh detected changes"
              echo ''
              echo '```diff'
              git diff --stat -- src/pricing data/aws-pricing data/azure-pricing data/gcp-pricing
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open pricing refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: bot/pricing-refresh
          commit-message: "chore(pricing): weekly fallback refresh"
          title: "chore(pricing): weekly fallback refresh"
          body: |
            Automated weekly refresh of bundled fallback pricing tables.

            - Generated by `.github/workflows/refresh-pricing.yml` via
              `npx tsx scripts/refresh-pricing.ts --write`
            - Build and tests passed against the refreshed data in this run:
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          add-paths: |
            src/pricing
            data/aws-pricing
            data/azure-pricing
            data/gcp-pricing
          delete-branch: true

      - name: File issue on refresh failure
        if: ${{ !cancelled() && (steps.refresh.outputs.exit != '0' || failure()) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFRESH_EXIT: ${{ steps.refresh.outputs.exit }}
        run: |
          set -euo pipefail
          title="Pricing refresh failed ($(date -u +%F))"

          # --force makes this idempotent and, more to the point, makes it work
          # at all. `gh issue create --label automation` fails outright when the
          # label does not exist — which it did not — so every alarm issue this
          # workflow has ever filed landed through the untagged fallback below,
          # unlabelled and unfindable.
          gh label create automation \
            --color 0E8A16 \
            --description "Filed by a scheduled workflow" \
            --force

          body="The weekly pricing refresh workflow did not complete cleanly."
          body="$body"$'\n\n'"Refresh script exit code: \`${REFRESH_EXIT:-(step did not run)}\`"
          body="$body"$'\n'"Run logs: $RUN_URL"
          body="$body"$'\n\n'"One or more providers could not be refreshed, so their bundled data is older than its metadata may suggest."

          existing=$(gh issue list --state open --search "\"Pricing refresh failed\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label automation --body "$body"
          fi

      - name: Fail job if refresh failed
        # `!cancelled() &&` is load-bearing. This condition used to be a bare
        # `steps.refresh.outcome == 'failure'`, and a step `if:` with no status
        # function gets an implicit success() prepended — so the one step whose
        # entire job is to fail loudly was itself skipped the moment anything
        # earlier in the job failed. Verified skipped in run 31388831580, the
        # most recent of twenty-six consecutive failed scheduled runs.
        if: ${{ !cancelled() && steps.refresh.outputs.exit != '0' }}
        env:
          REFRESH_EXIT: ${{ steps.refresh.outputs.exit }}
        run: |
          echo "Pricing refresh exited ${REFRESH_EXIT:-(step did not run)} — see the 'Run pricing refresh' step logs." >> "$GITHUB_STEP_SUMMARY"
          exit 1
