name: Refresh Pricing

# Weekly refresh of bundled AWS/Azure/GCP fallback pricing tables.
# Opens a PR from bot/pricing-refresh (instead of committing straight to
# main) and files an issue when the refresh fails so failures are visible.

on:
  schedule:
    # Mondays 12:00 UTC — avoids weekend quiet hours and still hits before
    # the US business day so any follow-up investigation is same-day.
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-pricing
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    # Guard so forks don't try to open PRs/issues on schedule.
    if: github.repository_owner == 'JadenRazo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run pricing refresh (write mode)
        id: refresh
        # A provider-level failure exits non-zero but still writes the
        # providers that succeeded — continue so those changes reach a PR,
        # then surface the failure via the issue + job-failure steps below.
        continue-on-error: true
        run: npx tsx scripts/refresh-pricing.ts --write

      - name: Build and test against refreshed data
        run: npm run build && npm test

      - name: Summarize changes
        id: diff
        run: |
          if git diff --quiet -- src/pricing data/aws-pricing data/azure-pricing data/gcp-pricing; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pricing changes detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Pricing refresh detected changes"
              echo ''
              echo '```diff'
              git diff --stat -- src/pricing data/aws-pricing data/azure-pricing data/gcp-pricing
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open pricing refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/pricing-refresh
          commit-message: "chore(pricing): weekly fallback refresh"
          title: "chore(pricing): weekly fallback refresh"
          body: |
            Automated weekly refresh of bundled fallback pricing tables.

            - Generated by `.github/workflows/refresh-pricing.yml` via
              `npx tsx scripts/refresh-pricing.ts --write`
            - Build and tests passed against the refreshed data in this run:
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          add-paths: |
            src/pricing
            data/aws-pricing
            data/azure-pricing
            data/gcp-pricing
          delete-branch: true

      - name: File issue on refresh failure
        if: steps.refresh.outcome == 'failure' || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Pricing refresh failed ($(date -u +%F))"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "\"Pricing refresh failed\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Pricing refresh failed again: $run_url"
          else
            gh issue create \
              --title "$title" \
              --label "automation" \
              --body "The weekly pricing refresh workflow failed. One or more providers could not be refreshed and their bundled data may be stale. See the run logs: $run_url" \
              || gh issue create \
                --title "$title" \
                --body "The weekly pricing refresh workflow failed. One or more providers could not be refreshed and their bundled data may be stale. See the run logs: $run_url"
          fi

      - name: Fail job if refresh failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "Pricing refresh reported a provider failure — see the 'Run pricing refresh' step logs." >> "$GITHUB_STEP_SUMMARY"
          exit 1
