# Example workflow — copy this file to your repository's .github/workflows/
# directory and adjust the inputs to match your project layout.
#
# It lives in examples/ rather than .github/workflows/ because GitHub does not
# read the sentence above: while it sat in the workflows directory it was a live
# workflow, registered as "Terraform Cost Estimate" and executed on every pull
# request to any base branch, cost-estimating this repository with a published
# build of itself. A file that documents a workflow and a file that is one are
# not the same file.

name: Terraform Cost Estimate

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  cost-estimate:
    name: Cost Estimate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch enough history so the action can diff against the base branch
          fetch-depth: 0

      - name: Run CloudCost estimate
        uses: ./.github/actions/cost-estimate
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Optionally pin a specific directory instead of auto-detecting:
          # terraform_dir: "./terraform"
          # providers: "aws,azure,gcp"
          # format: "markdown"
          # currency: "USD"
